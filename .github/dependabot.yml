# Dependabot: weekly dependency update PRs into main.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "npm" # also covers pnpm (pnpm-lock.yaml, pnpm-workspace.yaml)
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    # Wait a few days after a release before proposing it.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      # agents supports one Pi minor at a time, so they move together.
      agents-and-pi:
        patterns:
          - "agents"
          - "@earendil-works/*"
          - "@cloudflare/computer"
      cloudflare-tooling:
        patterns:
          - "wrangler"
          - "cf"
          - "@cloudflare/vite-plugin"
          - "@cloudflare/vitest-pool-workers"
          - "@cloudflare/workers-types"
          - "@cloudflare/kumo"
      vite-plus:
        patterns:
          - "vite-plus"
      ui:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@vitejs/plugin-react"
          - "streamdown"
          - "@phosphor-icons/react"
          - "tailwindcss"
          - "@tailwindcss/vite"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pi is pinned to ~1.5 to match agents' peer range; a new Pi minor
      # arrives with the agents release that supports it.
      - dependency-name: "@earendil-works/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # vite is an alias of @voidzero-dev/vite-plus-core, set by Vite+.
      # Update it through vite-plus instead.
      - dependency-name: "vite"
      - dependency-name: "@voidzero-dev/vite-plus-core"
      # @cloudflare/vitest-pool-workers supports Vitest 4 only.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # pi-ai and pi-schema pin typebox to exactly 1.3.27.
      - dependency-name: "typebox"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
