name: mutation

on:
  pull_request:
    paths:
      - "src/**"
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: choose files to mutate
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- 'src/*.ts' | grep -vE '^src/tests/|\.test\.ts$' | paste -sd, - || true)"
          else
            files=""
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "pr=$([ -n "$BASE_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: stryker (changed files)
        if: steps.scope.outputs.pr == 'true' && steps.scope.outputs.files != ''
        env:
          FILES: ${{ steps.scope.outputs.files }}
        run: bun run stryker run --mutate "$FILES"
      - name: stryker (all files)
        if: steps.scope.outputs.pr == 'false'
        run: bun run stryker run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
